@media (prefers-reduced-motion: no-preference){
svg[data-art] .tw{transform-box:fill-box;transform-origin:left center;animation:tw .4s cubic-bezier(.22,1,.36,1) backwards;animation-delay:min(calc(var(--i,0)*.03s),.6s)}
