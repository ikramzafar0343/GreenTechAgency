<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" overflow="visible" role="img" aria-label="2D/3D Video Animation — interface detail illustration"><title>2D/3D Video Animation — interface detail illustration</title><defs>
<linearGradient id="g57577bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111c"/><stop offset=".6" stop-color="#0b1d2e"/><stop offset="1" stop-color="#10324a"/></linearGradient>
<radialGradient id="g57577glow" cx="0.34" cy="0.21" r=".6"><stop offset="0" stop-color="#9db8ff" stop-opacity=".38"/><stop offset=".45" stop-color="#3e5bb8" stop-opacity=".16"/><stop offset="1" stop-color="#3e5bb8" stop-opacity="0"/></radialGradient>
<linearGradient id="g57577acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#3e5bb8"/></linearGradient>
<linearGradient id="g57577glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
<linearGradient id="g57577edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#3e5bb8" stop-opacity=".5"/></linearGradient>
<pattern id="g57577grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1d3b52" stroke-width="1" opacity=".55"/></pattern>
<filter id="g57577soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="g57577shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs><style>
@media (prefers-reduced-motion: no-preference){
.tw{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.area{fill-opacity:0}
.rise{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0)}
.ring-draw{stroke-dashoffset:1}
.st{opacity:0;transform:translateY(14px)}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0}
svg.play .tw{animation:tw .42s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0)*.055s)}
svg.play .draw{animation:draw 1.15s cubic-bezier(.22,1,.36,1) .15s forwards}
svg.play .area{animation:area .7s ease .55s forwards}
svg.play .rise{animation:rise .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.2s + var(--i,0)*.07s)}
svg.play .ring-draw{animation:ringDraw 1s cubic-bezier(.22,1,.36,1) .25s forwards}
svg.play .st{animation:st .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0)*.07s)}
svg.play .pop{animation:pop .4s cubic-bezier(.22,1,.36,1) 1.1s forwards}
svg.play .fl{animation:fl 7s ease-in-out 1.3s infinite}
svg.play .fl2{animation:fl 9s ease-in-out 1.1s infinite}
svg.play .pu{animation:pu 4s ease-in-out 1.2s infinite}
svg.play .da{stroke-dasharray:10 14;animation:da 6s linear 1.2s infinite}
svg.play .sp{transform-box:fill-box;transform-origin:center;animation:sp 24s linear 1.2s infinite}
@keyframes tw{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes area{to{fill-opacity:.12}}
@keyframes rise{to{transform:scaleY(1)}}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes st{to{opacity:1;transform:translateY(0)}}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-240}}
@keyframes sp{to{transform:rotate(360deg)}}}
</style><rect width="1200" height="1800" fill="url(#g57577bg)"/>
