</defs><style>
@media (prefers-reduced-motion: no-preference){
.fl{animation:fl 7s ease-in-out infinite}.fl2{animation:fl 9s ease-in-out -3s infinite}
.pu{animation:pu 4s ease-in-out infinite}.da{stroke-dasharray:10 14;animation:da 6s linear infinite}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-240}}
@keyframes sp{to{transform:rotate(360deg)}}}
</style><rect width="1200" height="1800" fill="url(#g57577bg)"/>
