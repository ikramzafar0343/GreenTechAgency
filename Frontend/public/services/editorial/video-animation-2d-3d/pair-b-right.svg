<radialGradient id="g2752glow" cx="0.34" cy="0.26" r=".6"><stop offset="0" stop-color="#9db8ff" stop-opacity=".38"/><stop offset=".45" stop-color="#3e5bb8" stop-opacity=".16"/><stop offset="1" stop-color="#3e5bb8" stop-opacity="0"/></radialGradient>
<linearGradient id="g2752acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#3e5bb8"/></linearGradient>
<linearGradient id="g2752glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
<linearGradient id="g2752edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#3e5bb8" stop-opacity=".5"/></linearGradient>
<pattern id="g2752grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1d3b52" stroke-width="1" opacity=".55"/></pattern>
