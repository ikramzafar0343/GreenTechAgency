svg.play .ring-draw{animation:ringDraw 1s cubic-bezier(.22,1,.36,1) .25s forwards}
svg.play .st{animation:st .5s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i,0)*.07s)}
