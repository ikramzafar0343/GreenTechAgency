<g class="fl2"><rect x="180" y="748" width="540" height="220" rx="26" fill="#0f2a40" opacity=".92" filter="url(#g83742shadow)"/><rect x="180" y="748" width="540" height="220" rx="26" fill="url(#g83742glass)" stroke="url(#g83742edge)" stroke-width="2"/></g><g class="fl2"><circle cx="450.0" cy="858.0" r="70.4" fill="none" stroke="#1d3b52" stroke-width="15"/><circle class="ring-draw" pathLength="1" cx="450.0" cy="858.0" r="70.4" fill="none" stroke="url(#g83742acc)" stroke-width="15" stroke-linecap="round" stroke-dasharray="0.720 1" transform="rotate(-90 450.0 858.0)"/><circle class="st" style="--i:2" cx="450.0" cy="858.0" r="35" fill="#7cf0b4" opacity=".12"/></g></svg>
