svg[data-art] .pop{transform-box:fill-box;transform-origin:center;animation:pop .3s cubic-bezier(.22,1,.36,1) .2s backwards}
@keyframes tw{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
