<radialGradient id="g52882glow" cx="0.61" cy="0.53" r=".6"><stop offset="0" stop-color="#9db8ff" stop-opacity=".38"/><stop offset=".45" stop-color="#3e5bb8" stop-opacity=".16"/><stop offset="1" stop-color="#3e5bb8" stop-opacity="0"/></radialGradient>
<linearGradient id="g52882acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#3e5bb8"/></linearGradient>
<linearGradient id="g52882glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
<linearGradient id="g52882edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db8ff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#3e5bb8" stop-opacity=".5"/></linearGradient>
