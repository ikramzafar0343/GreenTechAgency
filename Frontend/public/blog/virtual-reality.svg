@keyframes rise{from{transform:scaleY(0)}}
@keyframes ringDraw{from{stroke-dashoffset:1}}
@keyframes st{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{transform:scale(0);opacity:0}}}
