svg[data-art] .pop{transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.22,1,.36,1) .75s backwards}
@keyframes tw{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
